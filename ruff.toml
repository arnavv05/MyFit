# Ruff configuration for MyFitness monorepo
line-length = 88
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file (needed for sys.path configuration in standalone scripts and Streamlit apps)
    "E501",  # Line too long (handled by formatter)
    "W291",  # Trailing whitespace (common in markdown generation strings)
]
